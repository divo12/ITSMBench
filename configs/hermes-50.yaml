job_name: itsm-hermes-50
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1

agents:
  - name: agents.ofw_hermes:OfwHermes
    model_name: openai/gpt-5.4-mini
    env:
      HERMES_LANGFUSE_PUBLIC_KEY: "${HERMES_LANGFUSE_PUBLIC_KEY}"
      HERMES_LANGFUSE_SECRET_KEY: "${HERMES_LANGFUSE_SECRET_KEY}"
      HERMES_LANGFUSE_BASE_URL: "${HERMES_LANGFUSE_BASE_URL}"
      HERMES_LANGFUSE_ENV: itsm-bench
      HERMES_LANGFUSE_RELEASE: "${HERMES_LANGFUSE_RELEASE}"
      HERMES_LANGFUSE_SESSION_ID: "${HERMES_LANGFUSE_SESSION_ID}"

datasets:
  - path: tasks
    n_tasks: 50

environment:
  type: docker
